# Configuração de deploy no Netlify
#
# Plugin declarado explicitamente (achado na migração de conta: a
# auto-detecção do painel não instalou o runtime do Next.js neste site,
# diferente do agendapro-demo — toda rota respondia 404. Declarar aqui é
# mais robusto, não depende de detecção automática do painel).

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
